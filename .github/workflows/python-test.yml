name: Bug Bash Auto-Grader

on: [push, pull_request]

jobs:
  test:
     runs-on: ubuntu-latest
     steps:
       - name: Checkout Code
         uses: actions/checkout@v4

       - name: Set up Python
         uses: actions/setup-python@v5
         with:
           python-version: '3.10'

       - name: Run Tests
         run: |
           python -m unittest discover -s . -p "test_*.py"
